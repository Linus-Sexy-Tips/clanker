# Clanker configuration. Copy to /config/clanker.toml, or set CLANKER_CONFIG to its path.
# Only owner_id is required. Values shown are the defaults unless marked "example". More in docs/deploy.md.
# Secrets come from environment variables, not this file: FLUXER_BOT_TOKEN and ANTHROPIC_API_KEY,
# or FLUXER_BOT_TOKEN_FILE and ANTHROPIC_API_KEY_FILE with the path of a file holding the value.

owner_id = "1234567890"                   # example: your Fluxer user ID; gets alerts and owner commands
api_url = "https://api.fluxer.app/v1"     # change for a self-hosted Fluxer
# gateway_url = "wss://gateway.fluxer.app"  # normally discovered from the API
timezone = "UTC"                          # IANA zone for caps and timestamps, e.g. "America/Vancouver"
data_dir = "/data"                        # ledger and heartbeat; relative = from the working directory
source_url = "https://github.com/Linus-Sexy-Tips/clanker"  # AGPL: point this at your fork if you change the code

[access]
users = []                                # example: ["1234567890"]; allowed wherever the bot answers
blocked_users = []                        # never allowed, even with an allowed role
guilds_leave_unlisted = true              # leave any community not listed under [guilds]

# One table per community the bot serves. Members with any listed role may use it.
# [guilds."3456789012"]                   # example community ID
# roles = ["4567890123"]                  # example role ID
# channels = []                           # empty = any channel the bot can see

[dms]
enabled = true                            # allowed users can DM the bot; the owner always can

[model]
name = "claude-haiku-5-5"
effort = "medium"                         # low, medium, high, xhigh, or max
max_tokens = 8000                         # includes thinking
system_prompt_file = ""                   # empty = built-in prompt; relative to this file

[tools.web_search]
enabled = true
max_uses = 3                              # searches per request, US$0.01 each
allowed_domains = []                      # set this or blocked_domains, not both
blocked_domains = []
# [tools.web_search.user_location]        # optional; localizes results
# city = "Vancouver"
# region = "British Columbia"
# country = "CA"
# timezone = "America/Vancouver"

[tools.web_fetch]
enabled = true
max_uses = 3                              # pages per request
max_content_tokens = 10000                # token cap per page; PDFs aren't capped
allowed_domains = []
blocked_domains = []
citations = true

[context]
max_messages = 50                         # longest reply chain, in messages
max_chain_tokens = 50000                  # longest reply chain, in estimated tokens
max_request_tokens = 100000               # largest prompt; chain and tool budgets must fit, checked at startup
max_images = 4                            # images from the chain sent to Claude, up to 5 MiB each

[cache]
system_ttl = "1h"                         # "5m" or "1h": cache lifetime of the shared system prompt
replay_ttl_seconds = 300                  # how long to keep exact API turns in memory after last use (0 = off)
replay_max_mb = 64                        # memory cap for those turns

[limits]
user_daily_usd = 5.00                     # per user per day; 0 blocks, else at least one reservation (default US$0.40)
monthly_usd = 100.00                      # all users together per month; same rule
notice = "reply"                          # limit notices: "reply" in the channel, or "dm"
cooldown_seconds = 5                      # minimum time between a user's requests
max_concurrent = 4                        # Claude requests at once
max_queue = 8                             # requests waiting for a slot; more get a "busy" notice

# Higher daily caps for some users or roles. The highest matching cap applies.
# [[limits.overrides]]
# role = "4567890123"                     # or user = "<id>"; set exactly one
# user_daily_usd = 10.00

# Prices in USD per million tokens. Built in for claude-haiku-5-5, claude-sonnet-5-5, and claude-opus-5-5.
# An entry here replaces the built-in one completely.
# [prices."claude-some-model"]
# input = 1.0
# output = 5.0
# cache_write_5m = 1.25
# cache_write_1h = 2.0
# cache_read = 0.1
# Required when replacing Haiku 5.5, which charges more above 100,000 prompt tokens:
# [prices."claude-some-model".long_context]
# threshold = 100000
# input = 0.5
# output = 2.5
# cache_write_5m = 0.625
# cache_write_1h = 1.0
# cache_read = 0.05

[presence]
status = "online"                         # online, idle, dnd, or invisible
custom_status = "@mention me to ask"      # up to 128 characters; "" for none

[log]
level = "info"                            # debug, info, warn, or error; debug also logs message text and model output

[health]
ping_url = ""                             # e.g. a Healthchecks.io URL, pinged every 5 min while connected
heartbeat_file = ""                       # empty = <data_dir>/heartbeat; CLANKER_HEARTBEAT_FILE must match
